<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Car Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gallery-container">
        <h1>Exclusive Collection</h1>
        <p class="subtitle">High-definition viewing available</p>
        
        <div class="image-card">
            <img id="car-image" src="https://upload.wikimedia.org/wikipedia/commons/e/ee/Toyota_Supra_mk4.jpg" alt="Luxury Car" class="blurred">
            <div id="overlay" class="overlay">
                <div class="overlay-content">
                    <p>Preview mode: Low Resolution</p>
                    <button id="upgrade-btn">View High Resolution</button>
                </div>
            </div>
        </div>
        <p id="status-msg">Click below to unlock 4K experience</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
